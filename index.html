<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐧 ペンギンテニスDX</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🐧 ペンギンテニスDX 🎾</h1><section class="panel"><div class="grid"><label>モード<select id="mode"><option value="cpu">🤖 CPU対戦</option><option value="human">👥 同じ端末で対戦</option><option value="wall">🧱 壁打ち</option><option value="cup">🏆 トーナメント</option><option value="online">🌍 オンライン対戦</option></select></label><label>人数<select id="formation"><option value="1-1">1対1</option><option value="2-2">2対2</option><option value="1-2">1対2</option><option value="2-1">2対1</option></select></label><label>先取点<select id="goal"><option>3</option><option selected>5</option><option>10</option></select></label><label>CPU<select id="difficulty"><option value="1.8">よわい</option><option value="3" selected>ふつう</option><option value="4.5">つよい</option></select></label><label>🔵 ラケット<select id="blueRacket"><option value="normal">バランス</option><option value="power">パワー</option><option value="speed">スピード</option><option value="reach">ワイド</option><option value="control">コントロール</option></select></label><label>🔴 ラケット<select id="redRacket"><option value="normal">バランス</option><option value="power">パワー</option><option value="speed">スピード</option><option value="reach">ワイド</option><option value="control">コントロール</option></select></label></div><div id="online" hidden><h3>🌍 オンラインロビー</h3><p id="netStatus">Firebaseの設定を読み込み中…</p><div class="buttons"><button id="create">🏠 部屋を作る</button><input id="roomCode" inputmode="numeric" maxlength="6" placeholder="6桁の部屋番号"><button id="join">🚪 参加</button></div><div id="lobby" hidden><p id="roomInfo"></p><div id="players"></div><button id="onlineStart">🎾 ホストが試合開始</button><button id="leave">退出</button></div></div><div class="buttons"><button id="start" class="primary">▶ ゲーム開始</button><button id="pause">⏸ 一時停止</button><button id="reset">🔄 リセット</button></div></section><section id="bracketPanel" class="panel" hidden><h2 id="cupTitle">🏆 トーナメント表</h2><svg id="bracket" viewBox="0 0 640 290"></svg><button id="cupNext" class="primary">🎾 次の試合</button></section><section class="panel"><div class="score"><strong id="roundLabel">🎾 テニス</strong><strong id="score">🔵 0 - 0 🔴</strong></div><div class="meters"><div>🔵🔥 <progress id="meter0" max="100" value="0"></progress></div><div>🔴🔥 <progress id="meter1" max="100" value="0"></progress></div></div><div id="topControls" class="controls"></div><canvas id="court" width="640" height="390"></canvas><div id="message" class="message">ゲーム開始を押してな！</div><div id="bottomControls" class="controls"></div></section><footer>🐧 スマホでもパソコンでも遊べるで！</footer></main><script type="module" src="game.js"></script></body></html>
